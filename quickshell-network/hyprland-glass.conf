# Hyprland Glass Configuration for the Liquid Glass network menu
# ===============================================================
#
# The Quickshell network menu renders a semi-transparent frosted panel inside
# a layer-shell window whose namespace is `quickshell:network`. Hyprland
# applies real background blur to that window at the compositor level - this
# is what makes the glass effect work, and it costs the GPU nothing extra
# (the blur is a single compositor pass).
#
# Your main hyprland.conf already contains:
#   layerrule = blur on, ignore_alpha 0.15, match:namespace quickshell:network
#
# The `ignore_alpha 0.15` tells Hyprland: pixels with alpha below 0.15 are
# treated as fully transparent (no blur). Our glass fill sits at ~0.6 alpha,
# so it blurs; the fully transparent shadow margin stays clean.
#
# -----------------------------------------------------------------------------
# OPTIONAL - full setup for best results
# -----------------------------------------------------------------------------
# If you want to be explicit (and get a rounded, shadowed window edge from the
# compositor too), make sure these lines are present in ~/.config/hypr/hyprland.conf:

# layerrule = blur on, ignore_alpha 0.15, match:namespace quickshell:network
# layerrule = rounding 22, match:namespace quickshell:network

# -----------------------------------------------------------------------------
# How to apply / verify
# -----------------------------------------------------------------------------
# 1. Edit ~/.config/hypr/hyprland.conf and uncomment / add the lines above.
# 2. Reload Hyprland config:
#      hyprctl reload
# 3. Relaunch the menu (the Waybar network module already does this):
#      killall qs; qs -p ~/.config/quickshell-network &
#
# Notes:
#  - `rounding 22` matches the QML panel radius (GlassTheme.radiusPanel). If
#    you change the radius in GlassTheme.qml, keep this in sync.
#  - If you notice the drop shadow looking muddy, drop `rounding` and rely on
#    the QML GlassShadow only.
#  - Do NOT add `no_blur` for this namespace, and do NOT enable a QML-side blur
#    (MultiEffect/GaussianBlur): the compositor already does it, and a second
#    blur would double the GPU cost on the integrated Intel HD 4400.
